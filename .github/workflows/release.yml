name: Release Module

# Crea una release Foundry-ready ogni volta che pubblichi un tag vX.Y.Z su GitHub.
# Il workflow riscrive version/download dentro module.json, impacchetta module.zip
# e allega entrambi alla release: è quello che gli URL "manifest"/"download" si aspettano.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ricava la versione dal tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Aggiorna module.json
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          version: ${{ steps.version.outputs.value }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip

      - name: Crea module.zip
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            LICENSE \
            scripts \
            styles \
            lang

      - name: Allega gli artefatti alla release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
